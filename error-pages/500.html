<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>500 · Error interno | Emerald ERP</title>
  <link rel="stylesheet" href="/error-pages/assets/error.css?v=3">
</head>
<body>
  <main>
    <div class="brand">Emerald ERP</div>
    <figure>
      <img id="art" alt="Ilustración de error interno">
    </figure>
    <h1>Error interno del servidor</h1>
    <p>Algo salió mal de nuestro lado. El equipo ya fue notificado y está trabajando para resolverlo.</p>
    <span class="badge">Error 500 · Internal Server Error</span>
    <div class="actions">
      <a class="btn primary" href="javascript:location.reload()">Recargar página</a>
      <a class="btn ghost" href="/">Ir al inicio</a>
    </div>
    <footer>Emerald ERP · 2F Internet</footer>
  </main>
  <script>
    (function () {
      var art = document.getElementById('art');
      var images = ['/error-pages/assets/500.webp', '/error-pages/assets/500-2.webp'];
      art.src = images[Math.floor(Math.random() * images.length)];
    })();
  </script>
</body>
</html>
