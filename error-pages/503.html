<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>503 · Servicio no disponible | Emerald ERP</title>
  <link rel="stylesheet" href="/error-pages/assets/error.css?v=3">
</head>
<body>
  <main>
    <div class="brand">Emerald ERP</div>
    <figure>
      <img id="art" alt="Ilustración de servicio no disponible">
    </figure>
    <h1>Servicio no disponible</h1>
    <p>El servicio está temporalmente fuera de línea o sobrecargado. Probá de nuevo en unos instantes.</p>
    <span class="badge">Error 503 · Service Unavailable</span>
    <div class="actions">
      <a class="btn primary" href="javascript:location.reload()">Recargar página</a>
      <a class="btn ghost" href="/">Ir al inicio</a>
    </div>
    <footer>Emerald ERP · 2F Internet</footer>
  </main>
  <script>
    (function () {
      var art = document.getElementById('art');
      var images = ['/error-pages/assets/503.webp'];
      art.src = images[Math.floor(Math.random() * images.length)];
    })();
  </script>
</body>
</html>
